<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Chat App</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background-color: #0b141a;
    color: #e9edef;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Login Screen */
  #login-screen {
    width: 90%;
    max-width: 400px;
    padding: 30px;
    background: #111b21;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    text-align: center;
  }

  #login-screen h2 {
    color: #00a884;
    margin-bottom: 10px;
    font-size: 24px;
  }

  #login-screen p {
    color: #8696a0;
    font-size: 14px;
    margin-bottom: 20px;
  }

  #username-input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #2a3942;
    background: #202c33;
    color: #fff;
    font-size: 16px;
    outline: none;
    margin-bottom: 15px;
  }

  #login-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #00a884;
    color: #111b21;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  #login-btn:hover {
    background: #06cf9c;
  }

  /* Chat Container */
  #chat-screen {
    display: none;
    flex-direction: column;
    width: 100%;
    max-width: 500px;
    height: 100vh;
    background-color: #0b141a;
    border-left: 1px solid #222e35;
    border-right: 1px solid #222e35;
  }

  /* Header */
  .chat-header {
    background-color: #202c33;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2a3942;
  }

  .header-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #00a884;
    color: #111b21;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
  }

  .header-text h3 {
    font-size: 16px;
    font-weight: 600;
  }

  .header-text span {
    font-size: 12px;
    color: #00a884;
  }

  .logout-btn {
    background: transparent;
    border: 1px solid #374045;
    color: #aebac1;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }

  /* Messages Area */
  #messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background-image: radial-gradient(#182229 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .message {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 10px;
    position: relative;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.4;
  }

  .message.sent {
    align-self: flex-end;
    background-color: #005c4b;
    color: #e9edef;
    border-top-right-radius: 2px;
  }

  .message.received {
    align-self: flex-start;
    background-color: #202c33;
    color: #e9edef;
    border-top-left-radius: 2px;
  }

  .sender-name {
    font-size: 12px;
    font-weight: bold;
    color: #53bdeb;
    margin-bottom: 3px;
  }

  .msg-time {
    font-size: 11px;
    color: rgba(233, 237, 239, 0.65);
    text-align: right;
    margin-top: 4px;
  }

  /* Input Area */
  .input-area {
    background-color: #202c33;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #message-input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: none;
    background-color: #2a3942;
    color: #e9edef;
    font-size: 15px;
    outline: none;
  }

  #send-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background-color: #00a884;
    color: #111b21;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #send-btn:hover {
    background-color: #06cf9c;
  }
</style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <h2>ChatConnect</h2>
    <p>චැට් කිරීමට ඔබගේ නම ඇතුළත් කරන්න</p>
    <input type="text" id="username-input" placeholder="ඔබගේ නම (උදා: Ashan)" maxlength="20">
    <button id="login-btn">ඇතුළු වන්න</button>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div class="chat-header">
      <div class="header-info">
        <div class="avatar" id="user-avatar">A</div>
        <div class="header-text">
          <h3 id="display-username">User</h3>
          <span>● Online</span>
        </div>
      </div>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <input type="text" id="message-input" placeholder="මැසේජ් එකක් ලියන්න...">
      <button id="send-btn">➤</button>
    </div>
  </div>

<script>
  const DB_URL = "https://my-chat-2026-27a0b-default-rtdb.asia-southeast1.firebasedatabase.app/messages.json";

  const loginScreen = document.getElementById("login-screen");
  const chatScreen = document.getElementById("chat-screen");
  const usernameInput = document.getElementById("username-input");
  const loginBtn = document.getElementById("login-btn");
  const logoutBtn = document.getElementById("logout-btn");
  const displayUsername = document.getElementById("display-username");
  const userAvatar = document.getElementById("user-avatar");
  const messagesBox = document.getElementById("messages");
  const messageInput = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");

  let currentUser = localStorage.getItem("chat_username") || "";
  let lastRenderedIds = new Set();

  function startChat(name) {
    currentUser = name.trim();
    if (!currentUser) return;
    localStorage.setItem("chat_username", currentUser);
    displayUsername.textContent = currentUser;
    userAvatar.textContent = currentUser.charAt(0).toUpperCase();
    loginScreen.style.display = "none";
    chatScreen.style.display = "flex";
    fetchMessages();
  }

  if (currentUser) {
    startChat(currentUser);
  }

  loginBtn.addEventListener("click", () => {
    startChat(usernameInput.value);
  });

  usernameInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") startChat(usernameInput.value);
  });

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("chat_username");
    currentUser = "";
    lastRenderedIds.clear();
    messagesBox.innerHTML = "";
    chatScreen.style.display = "none";
    loginScreen.style.display = "block";
    usernameInput.value = "";
  });

  function formatTime(timestamp) {
    const date = new Date(timestamp);
    let hours = date.getHours();
    let minutes = date.getMinutes();
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    hours = hours ? hours : 12;
    minutes = minutes < 10 ? "0" + minutes : minutes;
    return `${hours}:${minutes} ${ampm}`;
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentUser) return;

    const payload = {
      sender: currentUser,
      text: text,
      time: Date.now()
    };

    messageInput.value = "";

    try {
      await fetch(DB_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      fetchMessages();
    } catch (err) {
      console.error("Error sending message:", err);
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  messageInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  async function fetchMessages() {
    try {
      const res = await fetch(DB_URL);
      const data = await res.json();

      if (!data) return;

      const entries = Object.entries(data).sort((a, b) => a[1].time - b[1].time);
      let hasNew = false;

      for (const [id, msg] of entries) {
        if (!lastRenderedIds.has(id)) {
          lastRenderedIds.add(id);
          hasNew = true;

          const msgDiv = document.createElement("div");
          const isSent = msg.sender === currentUser;
          msgDiv.className = `message ${isSent ? "sent" : "received"}`;

          if (!isSent) {
            const senderDiv = document.createElement("div");
            senderDiv.className = "sender-name";
            senderDiv.textContent = msg.sender;
            msgDiv.appendChild(senderDiv);
          }

          const textDiv = document.createElement("div");
          textDiv.textContent = msg.text;
          msgDiv.appendChild(textDiv);

          const timeDiv = document.createElement("div");
          timeDiv.className = "msg-time";
          timeDiv.textContent = formatTime(msg.time);
          msgDiv.appendChild(timeDiv);

          messagesBox.appendChild(msgDiv);
        }
      }

      if (hasNew) {
        messagesBox.scrollTop = messagesBox.scrollHeight;
      }
    } catch (err) {
      console.error("Error fetching messages:", err);
    }
  }

  setInterval(() => {
    if (currentUser) {
      fetchMessages();
    }
  }, 1500);
</script>
</body>
</html>
