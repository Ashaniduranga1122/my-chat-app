<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat App</title>
  <style>
    :root {
      --bg-main: #0b141a;
      --panel: #111b21;
      --panel-2: #202c33;
      --accent: #00a884;
      --online-blue: #4fc3f7;
      --seen-blue: #34b7f1;
      --text: #e9edef;
      --muted: #8696a0;
      --sent: #005c4b;
      --recv: #202c33;
      --border: #2a3942;
      --chat-wallpaper: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-main); color: var(--text); height: 100vh; overflow: hidden; }

    .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
    .screen.active { display: flex; }

    .auth-box {
      max-width: 400px; width: 92%; margin: auto; background: var(--panel);
      padding: 24px; border-radius: 14px; border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 14px;
    }
    .auth-box h2 { text-align: center; color: var(--accent); }
    .auth-box input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); outline: none;
    }
    .btn {
      padding: 11px 14px; border: none; border-radius: 8px; cursor: pointer;
      font-weight: 600; background: var(--accent); color: #06211a;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    .btn.full { width: 100%; }
    .err { color: #ff6b6b; font-size: 13px; min-height: 18px; text-align: center; }

    .topbar {
      background: var(--panel); padding: 10px 14px; display: flex;
      align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border);
      gap: 10px; z-index: 5;
    }
    .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
      background: var(--panel-2); border: 1px solid var(--border); display: block;
    }
    .online-disc {
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--online-blue);
      box-shadow: 0 0 8px rgba(79, 195, 247, 0.85);
      border: 2px solid var(--panel);
      position: absolute; right: -1px; bottom: -1px;
      display: none;
    }
    .online-disc.active { display: block; }

    .title-wrap { overflow: hidden; }
    .title-wrap h4 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-line {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 12px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-line.is-online { color: var(--online-blue); font-weight: 600; }
    .mini-disc {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--online-blue);
      box-shadow: 0 0 6px rgba(79, 195, 247, 0.85);
      display: inline-block; flex-shrink: 0;
    }

    .main-grid { display: flex; flex: 1; height: calc(100vh - 64px); overflow: hidden; }

    .sidebar {
      width: 330px; max-width: 100%; background: var(--panel);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
    }
    .sidebar-head { padding: 10px; border-bottom: 1px solid var(--border); }
    .sidebar-head input {
      width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); outline: none;
    }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item {
      display: flex; align-items: center; gap: 11px; padding: 11px 14px;
      cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .user-item:hover, .user-item.active { background: var(--panel-2); }

    .chat-panel {
      flex: 1; display: flex; flex-direction: column; position: relative;
      background-color: var(--bg-main);
      background-image: var(--chat-wallpaper);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .chat-overlay {
      flex: 1; display: flex; flex-direction: column;
      background: rgba(11, 20, 26, 0.28);
      height: 100%; overflow: hidden;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex;
      flex-direction: column; gap: 10px;
    }
    .empty-chat {
      margin: auto; color: var(--text); background: rgba(17, 27, 33, 0.85);
      padding: 14px 18px; border-radius: 12px; text-align: center; font-size: 13px;
    }
    .msg {
      max-width: 76%; padding: 9px 12px 7px 12px; border-radius: 10px;
      word-wrap: break-word; position: relative; font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .msg.sent { align-self: flex-end; background: var(--sent); }
    .msg.recv { align-self: flex-start; background: var(--recv); }
    .msg img, .msg video {
      max-width: 240px; max-height: 260px; border-radius: 8px;
      display: block; margin-top: 6px;
    }
    .msg-meta {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 5px; margin-top: 4px;
    }
    .msg-meta time { font-size: 10.5px; color: rgba(255,255,255,0.72); }

    /* Bold WhatsApp-style single & double ticks */
    .tick-svg {
      width: 17px; height: 12px; flex-shrink: 0;
      display: inline-block; vertical-align: middle;
    }
    .tick-svg path {
      fill: none;
      stroke: rgba(233, 237, 239, 0.78);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tick-svg.seen path {
      stroke: var(--seen-blue);
    }

    .composer {
      background: var(--panel); padding: 10px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .composer input[type="text"] {
      flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); outline: none;
    }
    .icon-btn {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center;
      cursor: pointer; flex-shrink: 0; font-size: 16px;
    }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      z-index: 50; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 420px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
      max-height: 88vh; overflow-y: auto;
    }
    .setting-block {
      background: var(--panel-2); padding: 12px; border-radius: 10px;
      border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;
    }
    .setting-block label { font-size: 13px; color: var(--text); font-weight: 600; }
    .setting-block small { font-size: 11.5px; color: var(--muted); }
    .modal-card select {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text);
    }
    .row { display: flex; gap: 8px; justify-content: flex-end; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; display: flex; }
      .chat-panel { display: none; width: 100%; }
      .main-grid.chat-open .sidebar { display: none; }
      .main-grid.chat-open .chat-panel { display: flex; }
    }
  </style>
</head>
<body>

  <section id="authScreen" class="screen active">
    <div class="auth-box">
      <h2 id="authTitle">Log In</h2>
      <input type="text" id="nameInput" placeholder="ඔබේ නම (Register වන විට)" style="display:none;" />
      <input type="email" id="emailInput" placeholder="Email ලිපිනය" />
      <input type="password" id="passwordInput" placeholder="Password (අවම අකුරු 6ක්)" />
      <button class="btn" id="authSubmitBtn">ඇතුළු වන්න</button>
      <button class="btn secondary" id="toggleAuthModeBtn">අලුත් ගිණුමක් සාදන්න (Register)</button>
      <div class="err" id="authError"></div>
    </div>
  </section>

  <section id="chatScreen" class="screen">
    <header class="topbar">
      <div class="user-info">
        <button class="icon-btn" id="backToUsersBtn" style="display:none;">←</button>
        <div class="avatar-wrap">
          <img id="headerAvatar" class="avatar" src="" alt="DP" />
          <span id="peerOnlineDisc" class="online-disc"></span>
        </div>
        <div class="title-wrap">
          <h4 id="headerTitle">User</h4>
          <div id="headerStatus" class="status-line">කතා කිරීමට කෙනෙකු තෝරන්න</div>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn secondary" id="openSettingsBtn">Settings</button>
        <button class="btn secondary" id="logoutBtn">Logout</button>
      </div>
    </header>

    <div class="main-grid" id="mainGrid">
      <aside class="sidebar">
        <div class="sidebar-head">
          <input type="text" id="searchUsersInput" placeholder="පරිශීලකයන් සොයන්න..." />
        </div>
        <div class="user-list" id="usersList"></div>
      </aside>

      <main class="chat-panel" id="chatPanel">
        <div class="chat-overlay">
          <div class="messages" id="messagesContainer">
            <div class="empty-chat">වම් පසින් පරිශීලකයෙකු තෝරා පෞද්ගලිකව කතා කරන්න.</div>
          </div>

          <form class="composer" id="messageForm">
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;" />
            <button type="button" class="icon-btn" id="attachBtn" title="Photo / Video">📎</button>
            <input type="text" id="messageInput" placeholder="මැසේජ් එකක් ලියන්න..." autocomplete="off" />
            <button type="submit" class="btn">Send</button>
          </form>
        </div>
      </main>
    </div>
  </section>

  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <h3>Settings</h3>

      <div class="setting-block">
        <label>Profile Picture (DP)</label>
        <small>ඔබේ ගිණුමේ DP එක වෙනස් කරන්න</small>
        <input type="file" id="dpFileInput" accept="image/*" style="display:none;" />
        <button type="button" class="btn full" id="chooseDpBtn">DP Photo තෝරන්න</button>
      </div>

      <div class="setting-block">
        <label>Chat Wallpaper</label>
        <small>මෙම Chat එකට පමණක් පෙනෙන Wallpaper එකක් දාන්න</small>
        <input type="file" id="wallpaperFileInput" accept="image/*" style="display:none;" />
        <button type="button" class="btn full" id="chooseWallpaperBtn">Wallpaper තෝරන්න</button>
        <button type="button" class="btn secondary full" id="clearWallpaperBtn">Wallpaper ඉවත් කරන්න</button>
      </div>

      <div class="setting-block">
        <label>Notification Sound</label>
        <small>මැසේජ් එද්දී ඇසෙන ශබ්දය තෝරන්න</small>
        <select id="soundSelect">
          <option value="chime">Soft Chime</option>
          <option value="pop">Classic Pop</option>
          <option value="mute">Mute (Sound Off)</option>
        </select>
        <button type="button" class="btn secondary full" id="testSoundBtn">Sound Test කරන්න</button>
      </div>

      <div class="row">
        <button type="button" class="btn secondary full" id="closeSettingsBtn">වසන්න</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6sxe0wx35Xnm1IWQmQEXYl2GIYZoyoFA",
      authDomain: "my-chat-2026-27a0b.firebaseapp.com",
      databaseURL: "https://my-chat-2026-27a0b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "my-chat-2026-27a0b",
      storageBucket: "my-chat-2026-27a0b.firebasestorage.app",
      messagingSenderId: "346627278467",
      appId: "1:346627278467:web:3194f015fbcf7ba50cfdb6"
    };

    const MEDIA_UPLOAD_URL = "";
    const MEDIA_UPLOAD_PRESET = "";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const DEFAULT_DP = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
        <rect width="80" height="80" fill="#202c33"/>
        <circle cx="40" cy="30" r="14" fill="#8696a0"/>
        <path d="M16 70c2-14 12-22 24-22s22 8 24 22" fill="#8696a0"/>
      </svg>`
    );

    let isRegisterMode = false;
    let currentUser = null;
    let selectedPeer = null;
    let messagesRef = null;
    let allUsers = {};
    let isInitialLoad = true;
    let audioCtx = null;

    const authScreen = document.getElementById("authScreen");
    const chatScreen = document.getElementById("chatScreen");
    const authTitle = document.getElementById("authTitle");
    const nameInput = document.getElementById("nameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const authSubmitBtn = document.getElementById("authSubmitBtn");
    const toggleAuthModeBtn = document.getElementById("toggleAuthModeBtn");
    const authError = document.getElementById("authError");

    const headerAvatar = document.getElementById("headerAvatar");
    const peerOnlineDisc = document.getElementById("peerOnlineDisc");
    const headerTitle = document.getElementById("headerTitle");
    const headerStatus = document.getElementById("headerStatus");
    const usersList = document.getElementById("usersList");
    const searchUsersInput = document.getElementById("searchUsersInput");
    const messagesContainer = document.getElementById("messagesContainer");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const attachBtn = document.getElementById("attachBtn");
    const mediaInput = document.getElementById("mediaInput");
    const mainGrid = document.getElementById("mainGrid");
    const backToUsersBtn = document.getElementById("backToUsersBtn");

    const settingsModal = document.getElementById("settingsModal");
    const openSettingsBtn = document.getElementById("openSettingsBtn");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const dpFileInput = document.getElementById("dpFileInput");
    const chooseDpBtn = document.getElementById("chooseDpBtn");
    const wallpaperFileInput = document.getElementById("wallpaperFileInput");
    const chooseWallpaperBtn = document.getElementById("chooseWallpaperBtn");
    const clearWallpaperBtn = document.getElementById("clearWallpaperBtn");
    const soundSelect = document.getElementById("soundSelect");
    const testSoundBtn = document.getElementById("testSoundBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function unlockAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      } catch (_) {}
    }

    document.addEventListener("click", unlockAudio, { passive: true });
    document.addEventListener("touchstart", unlockAudio, { passive: true });

    function formatLastSeen(ts) {
      if (!ts) return "Last seen recently";
      const diffSec = Math.floor((Date.now() - ts) / 1000);
      if (diffSec < 60) return "Last seen just now";
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `Last seen ${diffMin} min ago`;
      const d = new Date(ts);
      const timeStr = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const isToday = d.toDateString() === new Date().toDateString();
      return isToday ? `Last seen today at ${timeStr}` : `Last seen ${d.toLocaleDateString()} ${timeStr}`;
    }

    function getPresenceMarkup(userObj, showDiscForOnline = true) {
      if (userObj && userObj.online === true) {
        return {
          text: showDiscForOnline
            ? `<span class="mini-disc"></span><span>Online</span>`
            : `Online`,
          isOnline: true
        };
      }
      return {
        text: `<span>${escapeHtml(formatLastSeen(userObj && userObj.lastSeen))}</span>`,
        isOnline: false
      };
    }

    function updateHeaderDisplay() {
      if (!currentUser) return;
      const me = allUsers[currentUser.uid] || {};

      if (selectedPeer) {
        const livePeer = allUsers[selectedPeer.uid] || selectedPeer;
        headerAvatar.src = livePeer.dp || DEFAULT_DP;
        headerTitle.textContent = livePeer.name || livePeer.email;
        const p = getPresenceMarkup(livePeer, true);
        peerOnlineDisc.classList.toggle("active", p.isOnline);
        headerStatus.classList.toggle("is-online", p.isOnline);
        headerStatus.innerHTML = p.text;
      } else {
        headerAvatar.src = me.dp || DEFAULT_DP;
        headerTitle.textContent = me.name || currentUser.email;
        peerOnlineDisc.classList.remove("active");
        headerStatus.classList.remove("is-online");
        headerStatus.textContent = "කතා කිරීමට කෙනෙකු තෝරන්න";
      }
    }

    function setupPresence(uid) {
      const userRef = db.ref(`users/${uid}`);
      const connectedRef = db.ref(".info/connected");

      connectedRef.on("value", (snap) => {
        if (snap.val() === true) {
          userRef.update({ online: true });
          userRef.onDisconnect().update({
            online: false,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (!currentUser) return;
        if (document.hidden) {
          userRef.update({ online: false, lastSeen: Date.now() });
        } else {
          userRef.update({ online: true });
        }
      });
    }

    function getChatId(uid1, uid2) {
      return [uid1, uid2].sort().join("_");
    }

    function playNotificationSound() {
      const mode = soundSelect.value || localStorage.getItem("chatSound") || "chime";
      if (mode === "mute") return;
      try {
        unlockAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = mode === "chime" ? "sine" : "triangle";
        osc.frequency.setValueAtTime(mode === "chime" ? 660 : 440, audioCtx.currentTime);
        if (mode === "chime") {
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.18);
        }
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
      } catch (_) {}
    }

    function getWallpaperStorageKey() {
      if (!currentUser || !selectedPeer) return null;
      return `wp_${currentUser.uid}_${getChatId(currentUser.uid, selectedPeer.uid)}`;
    }

    function applyLocalWallpaper() {
      const key = getWallpaperStorageKey();
      let savedWp = key ? localStorage.getItem(key) : null;
      if (!savedWp && currentUser && selectedPeer) {
        const chatId = getChatId(currentUser.uid, selectedPeer.uid);
        const me = allUsers[currentUser.uid];
        if (me && me.wallpapers && me.wallpapers[chatId]) {
          savedWp = me.wallpapers[chatId];
        }
      }
      document.documentElement.style.setProperty(
        "--chat-wallpaper",
        savedWp ? `url("${savedWp}")` : "none"
      );
    }

    function renderTickSvg(msg) {
      if (msg.senderId !== currentUser.uid) return "";
      const isSeen = msg.status === "seen";
      const isDelivered = msg.status === "delivered" || isSeen;
      const seenClass = isSeen ? " seen" : "";

      if (isDelivered) {
        return `
          <svg class="tick-svg${seenClass}" viewBox="0 0 24 16" aria-label="${isSeen ? "Seen" : "Delivered"}">
            <path d="M2 8.5L6.5 13L15.5 3" />
            <path d="M8.5 8.5L13 13L22 3" />
          </svg>
        `;
      }
      return `
        <svg class="tick-svg" viewBox="0 0 20 16" aria-label="Sent">
          <path d="M4 8.5L8.5 13L17.5 3" />
        </svg>
      `;
    }

    toggleAuthModeBtn.addEventListener("click", () => {
      isRegisterMode = !isRegisterMode;
      authError.textContent = "";
      if (isRegisterMode) {
        authTitle.textContent = "Create Account";
        nameInput.style.display = "block";
        authSubmitBtn.textContent = "Register";
        toggleAuthModeBtn.textContent = "දැනටමත් ගිණුමක් තිබේද? Login වන්න";
      } else {
        authTitle.textContent = "Log In";
        nameInput.style.display = "none";
        authSubmitBtn.textContent = "ඇතුළු වන්න";
        toggleAuthModeBtn.textContent = "අලුත් ගිණුමක් සාදන්න (Register)";
      }
    });

    authSubmitBtn.addEventListener("click", async () => {
      unlockAudio();
      authError.textContent = "";
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const displayName = nameInput.value.trim();

      if (!email || !password) {
        authError.textContent = "Email සහ Password ඇතුළත් කරන්න.";
        return;
      }

      try {
        if (isRegisterMode) {
          if (!displayName) {
            authError.textContent = "කරුණාකර ඔබේ නම ඇතුළත් කරන්න.";
            return;
          }
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.ref(`users/${cred.user.uid}`).set({
            uid: cred.user.uid,
            name: displayName,
            email: email,
            dp: DEFAULT_DP,
            online: true,
            lastSeen: Date.now()
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        authError.textContent = err.message;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      if (currentUser) {
        await db.ref(`users/${currentUser.uid}`).update({ online: false, lastSeen: Date.now() });
      }
      if (messagesRef) messagesRef.off();
      auth.signOut();
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        authScreen.classList.remove("active");
        chatScreen.classList.add("active");

        const savedSound = localStorage.getItem("chatSound") || "chime";
        soundSelect.value = savedSound;

        setupPresence(user.uid);

        db.ref("users").on("value", (snap) => {
          allUsers = snap.val() || {};
          renderUsersList();
          updateHeaderDisplay();
          applyLocalWallpaper();
        });
      } else {
        currentUser = null;
        selectedPeer = null;
        chatScreen.classList.remove("active");
        authScreen.classList.add("active");
      }
    });

    function renderUsersList() {
      const q = searchUsersInput.value.trim().toLowerCase();
      usersList.innerHTML = "";

      Object.values(allUsers).forEach((u) => {
        if (!currentUser || u.uid === currentUser.uid) return;
        const label = `${u.name || ""} ${u.email || ""}`.toLowerCase();
        if (q && !label.includes(q)) return;

        const p = getPresenceMarkup(u, true);
        const item = document.createElement("div");
        item.className = "user-item" + (selectedPeer && selectedPeer.uid === u.uid ? " active" : "");
        item.innerHTML = `
          <div class="avatar-wrap">
            <img class="avatar" src="${u.dp || DEFAULT_DP}" alt="DP" />
            <span class="online-disc ${p.isOnline ? "active" : ""}"></span>
          </div>
          <div class="title-wrap">
            <h4>${escapeHtml(u.name || u.email)}</h4>
            <div class="status-line ${p.isOnline ? "is-online" : ""}">${p.text}</div>
          </div>
        `;
        item.addEventListener("click", () => openChatWith(u));
        usersList.appendChild(item);
      });
    }

    searchUsersInput.addEventListener("input", renderUsersList);

    function openChatWith(peer) {
      unlockAudio();
      selectedPeer = peer;
      updateHeaderDisplay();
      mainGrid.classList.add("chat-open");
      if (window.innerWidth <= 768) backToUsersBtn.style.display = "grid";
      renderUsersList();
      applyLocalWallpaper();

      if (messagesRef) messagesRef.off();
      messagesContainer.innerHTML = "";
      isInitialLoad = true;

      const chatId = getChatId(currentUser.uid, peer.uid);
      messagesRef = db.ref(`chats/${chatId}/messages`).limitToLast(100);

      messagesRef.once("value", () => {
        isInitialLoad = false;
      });

      messagesRef.on("child_added", async (snap) => {
        const msg = snap.val();
        if (!msg) return;

        if (msg.senderId !== currentUser.uid && msg.status !== "seen") {
          await snap.ref.update({ status: "seen" });
        }

        renderOrUpdateMessage(snap.key, msg);
        if (!isInitialLoad && msg.senderId !== currentUser.uid) {
          playNotificationSound();
        }
      });

      messagesRef.on("child_changed", (snap) => {
        const msg = snap.val();
        if (!msg) return;
        renderOrUpdateMessage(snap.key, msg);
      });
    }

    backToUsersBtn.addEventListener("click", () => {
      selectedPeer = null;
      mainGrid.classList.remove("chat-open");
      backToUsersBtn.style.display = "none";
      updateHeaderDisplay();
      applyLocalWallpaper();
      renderUsersList();
    });

    function renderOrUpdateMessage(msgId, msg) {
      const emptyEl = messagesContainer.querySelector(".empty-chat");
      if (emptyEl) emptyEl.remove();

      const isMine = msg.senderId === currentUser.uid;
      let mediaHtml = "";
      if (msg.mediaType === "image" && msg.mediaUrl) {
        mediaHtml = `<img src="${escapeAttr(msg.mediaUrl)}" alt="Photo" />`;
      } else if (msg.mediaType === "video" && msg.mediaUrl) {
        mediaHtml = `<video controls src="${escapeAttr(msg.mediaUrl)}"></video>`;
      }

      const textHtml = msg.text ? `<div>${escapeHtml(msg.text)}</div>` : "";
      const timeStr = msg.timestamp
        ? new Date(msg.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        : "";
      const tickHtml = renderTickSvg(msg);

      const content = `${textHtml}${mediaHtml}<div class="msg-meta"><time>${timeStr}</time>${tickHtml}</div>`;

      let div = messagesContainer.querySelector(`[data-msg-id="${msgId}"]`);
      if (!div) {
        div = document.createElement("div");
        div.setAttribute("data-msg-id", msgId);
        messagesContainer.appendChild(div);
      }
      div.className = "msg " + (isMine ? "sent" : "recv");
      div.innerHTML = content;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    messageForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      unlockAudio();
      if (!currentUser || !selectedPeer) {
        alert("කරුණාකර මුලින්ම කතා කිරීමට කෙනෙකු තෝරන්න.");
        return;
      }
      const text = messageInput.value.trim();
      if (!text) return;

      const peerLive = allUsers[selectedPeer.uid] || selectedPeer;
      const initialStatus = peerLive && peerLive.online === true ? "delivered" : "sent";

      const chatId = getChatId(currentUser.uid, selectedPeer.uid);
      await db.ref(`chats/${chatId}/messages`).push({
        senderId: currentUser.uid,
        receiverId: selectedPeer.uid,
        text,
        mediaType: null,
        mediaUrl: null,
        status: initialStatus,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
      messageInput.value = "";
    });

    attachBtn.addEventListener("click", () => {
      if (!selectedPeer) {
        alert("කරුණාකර මුලින්ම Chat එකක් විවෘත කරන්න.");
        return;
      }
      mediaInput.click();
    });

    mediaInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser || !selectedPeer) return;

      const isVideo = file.type.startsWith("video/");
      const mediaType = isVideo ? "video" : "image";
      const chatId = getChatId(currentUser.uid, selectedPeer.uid);
      const peerLive = allUsers[selectedPeer.uid] || selectedPeer;
      const initialStatus = peerLive && peerLive.online === true ? "delivered" : "sent";

      try {
        attachBtn.textContent = "⏳";
        let finalUrl = "";

        if (MEDIA_UPLOAD_URL && MEDIA_UPLOAD_PRESET) {
          const formData = new FormData();
          formData.append("file", file);
          formData.append("upload_preset", MEDIA_UPLOAD_PRESET);
          const res = await fetch(MEDIA_UPLOAD_URL, { method: "POST", body: formData });
          const data = await res.json();
          if (!data.secure_url) throw new Error("Upload failed");
          finalUrl = data.secure_url;
        } else if (!isVideo && file.size <= 350 * 1024) {
          finalUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        } else {
          throw new Error(
            isVideo
              ? "Video Upload කිරීමට MEDIA_UPLOAD_URL සහ MEDIA_UPLOAD_PRESET සකසන්න."
              : "350KB ට වඩා විශාල Photo යැවීමට MEDIA_UPLOAD_URL සහ MEDIA_UPLOAD_PRESET සකසන්න."
          );
        }

        await db.ref(`chats/${chatId}/messages`).push({
          senderId: currentUser.uid,
          receiverId: selectedPeer.uid,
          text: "",
          mediaType,
          mediaUrl: finalUrl,
          status: initialStatus,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
      } catch (err) {
        alert("Media Upload දෝෂයක්: " + err.message);
      } finally {
        attachBtn.textContent = "📎";
        mediaInput.value = "";
      }
    });

    openSettingsBtn.addEventListener("click", () => settingsModal.classList.add("active"));
    closeSettingsBtn.addEventListener("click", () => settingsModal.classList.remove("active"));

    chooseDpBtn.addEventListener("click", () => dpFileInput.click());
    dpFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser) return;
      const reader = new FileReader();
      reader.onload = async () => {
        await db.ref(`users/${currentUser.uid}/dp`).set(reader.result);
        alert("DP එක යාවත්කාලීන වුණා!");
      };
      reader.readAsDataURL(file);
    });

    chooseWallpaperBtn.addEventListener("click", () => {
      if (!currentUser || !selectedPeer) {
        alert("Wallpaper දැමීමට මුලින්ම Chat එකක් විවෘත කර තිබිය යුතුය.");
        return;
      }
      wallpaperFileInput.click();
    });

    wallpaperFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser || !selectedPeer) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const key = getWallpaperStorageKey();
        const chatId = getChatId(currentUser.uid, selectedPeer.uid);
        try {
          if (key) localStorage.setItem(key, reader.result);
          if (reader.result.length <= 450 * 1024) {
            await db.ref(`users/${currentUser.uid}/wallpapers/${chatId}`).set(reader.result);
          }
        } catch (_) {}
        applyLocalWallpaper();
        alert("Wallpaper එක සකස් කළා!");
      };
      reader.readAsDataURL(file);
    });

    clearWallpaperBtn.addEventListener("click", async () => {
      if (!currentUser || !selectedPeer) return;
      const key = getWallpaperStorageKey();
      const chatId = getChatId(currentUser.uid, selectedPeer.uid);
      if (key) localStorage.removeItem(key);
      try {
        await db.ref(`users/${currentUser.uid}/wallpapers/${chatId}`).remove();
      } catch (_) {}
      applyLocalWallpaper();
      alert("Wallpaper එක ඉවත් කළා!");
    });

    soundSelect.addEventListener("change", () => {
      localStorage.setItem("chatSound", soundSelect.value);
    });

    testSoundBtn.addEventListener("click", () => {
      unlockAudio();
      playNotificationSound();
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
