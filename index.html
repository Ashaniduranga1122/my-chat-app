<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhatsApp</title>
  <style>
    :root {
      --bg-main: #0b141a;
      --panel: #111b21;
      --panel-2: #202c33;
      --panel-3: #2a3942;
      --accent: #00a884;
      --online-blue: #4fc3f7;
      --status-unseen: #4fc3f7;
      --status-seen: #6b7c85;
      --seen-blue: #53bdeb;
      --text: #e9edef;
      --muted: #8696a0;
      --sent: #005c4b;
      --recv: #202c33;
      --border: #222e35;
      --danger: #ef5350;
      --chat-wallpaper: none;
      --msg-font-size: 14.5px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-main);
      color: var(--text);
    }

    .screen {
      display: none;
      width: 100%;
      height: 100dvh;
      flex-direction: column;
      overflow: hidden;
    }
    .screen.active { display: flex; }

    /* Auth */
    .auth-box {
      width: min(390px, 92%);
      margin: auto;
      background: var(--panel);
      padding: 22px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .auth-box h2 { text-align: center; color: var(--accent); font-size: 22px; }
    .auth-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--panel-3);
      background: var(--panel-2);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }
    .err { color: #ff7675; font-size: 12.5px; min-height: 16px; text-align: center; }

    /* Buttons */
    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      background: var(--accent);
      color: #041f18;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--panel-3);
    }
    .btn.danger {
      background: rgba(239, 83, 80, 0.16);
      color: #ff8a80;
      border: 1px solid rgba(239, 83, 80, 0.35);
    }
    .btn.small { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; }
    .btn.full { width: 100%; }

    .icon-btn {
      background: transparent;
      color: var(--text);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 18px;
    }
    .icon-btn:active { background: var(--panel-2); }
    .icon-btn.recording {
      background: #d32f2f;
      color: #fff;
      animation: pulseRec 1s infinite;
    }
    @keyframes pulseRec {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Topbar */
    .topbar {
      background: var(--panel);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 6px;
      min-height: 56px;
      width: 100%;
      flex-shrink: 0;
      z-index: 20;
    }
    .peer-trigger {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }
    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
      padding: 2px;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .avatar-wrap.status-unseen { border-color: var(--status-unseen); }
    .avatar-wrap.status-seen { border-color: var(--status-seen); }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--panel-2);
      display: block;
    }
    .online-disc {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--online-blue);
      box-shadow: 0 0 7px rgba(79, 195, 247, 0.9);
      border: 2px solid var(--panel);
      position: absolute;
      right: 0;
      bottom: 0;
      display: none;
    }
    .online-disc.active { display: block; }

    .title-wrap { min-width: 0; flex: 1; }
    .title-wrap h4 {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-line.is-online { color: var(--online-blue); font-weight: 600; }
    .mini-disc {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online-blue);
      box-shadow: 0 0 6px rgba(79, 195, 247, 0.9);
      display: inline-block;
      flex-shrink: 0;
    }

    /* Main Grid */
    .main-grid {
      display: flex;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .sidebar {
      width: 350px;
      max-width: 100%;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-tab {
      padding: 11px 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-pane { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
    .tab-pane.active { display: flex; }

    .search-bar { padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .search-bar input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid var(--panel-3);
      background: var(--panel-2);
      color: var(--text);
      outline: none;
      font-size: 13.5px;
    }

    .scroll-list { flex: 1; overflow-y: auto; min-height: 0; }
    .list-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .list-row:hover, .list-row.active { background: var(--panel-2); }
    .row-meta { flex: 1; min-width: 0; }
    .row-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Status */
    .status-pad { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .status-card {
      background: var(--panel-2);
      border: 1px solid var(--panel-3);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }
    .status-text-banner {
      border-radius: 10px;
      padding: 18px 14px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }
    .status-media { width: 100%; max-height: 190px; object-fit: cover; border-radius: 8px; }
    .status-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--muted); }

    .color-palette {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .color-swatch.selected { border-color: #ffffff; transform: scale(1.08); }

    /* Settings */
    .settings-scroll { padding: 12px; display: flex; flex-direction: column; gap: 11px; overflow-y: auto; }
    .setting-card {
      background: var(--panel-2);
      border: 1px solid var(--panel-3);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setting-card label { font-size: 13px; font-weight: 600; }
    .setting-card input[type="text"], .setting-card select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--panel-3);
      background: var(--panel);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }
    .custom-pick-list {
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
      padding: 8px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--panel-3);
    }
    .custom-pick-list.open { display: flex; }
    .pick-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }

    /* Chat Area */
    .chat-panel {
      flex: 1;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-main);
      background-image: var(--chat-wallpaper);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .chat-overlay {
      flex: 1;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(11, 20, 26, 0.22);
      overflow: hidden;
    }
    .messages {
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .empty-chat {
      margin: auto;
      color: var(--text);
      background: rgba(17, 27, 33, 0.88);
      padding: 12px 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
    }
    .msg {
      max-width: 80%;
      padding: 8px 11px 6px 11px;
      border-radius: 10px;
      word-wrap: break-word;
      position: relative;
      font-size: var(--msg-font-size);
      line-height: 1.38;
      box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .msg.sent { align-self: flex-end; background: var(--sent); border-top-right-radius: 2px; }
    .msg.recv { align-self: flex-start; background: var(--recv); border-top-left-radius: 2px; }
    .msg.deleted-msg { font-style: italic; color: rgba(233, 237, 239, 0.72); }
    .msg img, .msg video {
      max-width: 220px;
      max-height: 230px;
      border-radius: 8px;
      display: block;
      margin-top: 5px;
    }
    .msg audio { width: 195px; max-width: 100%; height: 34px; margin-top: 4px; display: block; }
    .edited-tag { font-size: 10.5px; color: rgba(255,255,255,0.62); margin-left: 4px; font-style: italic; }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 3px;
    }
    .msg-meta time { font-size: 10.5px; color: rgba(255,255,255,0.72); }

    /* Bold WhatsApp Ticks */
    .tick-svg {
      width: 18px;
      height: 12px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }
    .tick-svg path {
      fill: none;
      stroke: rgba(233, 237, 239, 0.82);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tick-svg.seen path { stroke: var(--seen-blue); }

    .blocked-banner {
      background: rgba(17, 27, 33, 0.95);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .blocked-banner.active { display: flex; }

    /* Composer strictly fitted to width */
    .composer {
      background: var(--panel);
      padding: 7px 8px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      min-width: 0;
      flex-shrink: 0;
    }
    .composer.hidden { display: none; }
    .composer input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      border-radius: 20px;
      border: 1px solid var(--panel-3);
      background: var(--panel-2);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    /* Dropdown Menu */
    .dropdown-menu {
      display: none;
      position: fixed;
      top: 54px;
      right: 10px;
      background: var(--panel-2);
      border: 1px solid var(--panel-3);
      border-radius: 10px;
      min-width: 180px;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .dropdown-menu.open { display: flex; flex-direction: column; }
    .dropdown-item {
      padding: 11px 14px;
      font-size: 13.5px;
      color: var(--text);
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:active, .dropdown-item:hover { background: var(--panel-3); }
    .dropdown-item.danger { color: #ff8a80; }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.76);
      z-index: 60;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .sheet {
      background: var(--panel);
      border: 1px solid var(--panel-3);
      border-radius: 14px;
      width: 100%;
      max-width: 370px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 86vh;
      overflow-y: auto;
    }
    .sheet h3 { font-size: 16px; }
    .sheet p { font-size: 12.5px; color: var(--muted); }
    .sheet input, .sheet textarea, .sheet select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid var(--panel-3);
      background: var(--panel-2);
      color: var(--text);
      outline: none;
      font-size: 13.5px;
    }
    .sheet textarea { min-height: 70px; resize: vertical; }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .sidebar { width: 100%; display: flex; }
      .chat-panel { display: none; width: 100%; }
      .main-grid.chat-open .sidebar { display: none; }
      .main-grid.chat-open .chat-panel { display: flex; }
    }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <section id="authScreen" class="screen active">
    <div class="auth-box">
      <h2 id="authTitle">Log in</h2>
      <input type="text" id="nameInput" placeholder="Name" style="display:none;" />
      <input type="email" id="emailInput" placeholder="Email" />
      <input type="password" id="passwordInput" placeholder="Password (min 6 chars)" />
      <button class="btn" id="authSubmitBtn">Log in</button>
      <button class="btn secondary" id="toggleAuthModeBtn">Create account</button>
      <div class="err" id="authError"></div>
    </div>
  </section>

  <!-- Main Screen -->
  <section id="chatScreen" class="screen">
    <header class="topbar">
      <div class="peer-trigger" id="headerPeerTrigger">
        <button class="icon-btn" id="backToUsersBtn" style="display:none;" onclick="event.stopPropagation()">←</button>
        <div class="avatar-wrap" id="headerAvatarWrap">
          <img id="headerAvatar" class="avatar" src="" alt="" />
          <span id="peerOnlineDisc" class="online-disc"></span>
        </div>
        <div class="title-wrap">
          <h4 id="headerTitle">WhatsApp</h4>
          <div id="headerStatus" class="status-line"></div>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
        <button class="btn secondary small" id="logoutBtn">Log out</button>
        <button class="icon-btn" id="chatMoreBtn" style="display:none;" title="More">⋮</button>
      </div>
    </header>

    <!-- Chat 3-Dot Menu -->
    <div class="dropdown-menu" id="chatMoreMenu">
      <button class="dropdown-item" id="menuOpenSettingsBtn">Settings</button>
      <button class="dropdown-item" id="menuWallpaperBtn">Wallpaper</button>
      <button class="dropdown-item" id="menuFontSizeBtn">Font size</button>
      <button class="dropdown-item" id="menuLockChatBtn">Lock chat</button>
      <button class="dropdown-item danger" id="menuBlockBtn">Block</button>
    </div>

    <div class="main-grid" id="mainGrid">
      <aside class="sidebar">
        <div class="nav-tabs">
          <div class="nav-tab active" data-tab="chatsTab">Chats</div>
          <div class="nav-tab" data-tab="statusTab">Status</div>
          <div class="nav-tab" data-tab="settingsTab">Settings</div>
        </div>

        <!-- Chats -->
        <div class="tab-pane active" id="chatsTab">
          <div class="search-bar">
            <input type="text" id="searchUsersInput" placeholder="Search..." />
          </div>
          <div class="scroll-list" id="usersList"></div>
        </div>

        <!-- Status -->
        <div class="tab-pane" id="statusTab">
          <div class="status-pad">
            <button class="btn full" id="openAddStatusBtn">Add status</button>
          </div>
          <div class="scroll-list status-pad" id="statusFeedList" style="padding-top:0;"></div>
        </div>

        <!-- Settings -->
        <div class="tab-pane" id="settingsTab">
          <div class="settings-scroll">
            <div class="setting-card">
              <label>Profile photo</label>
              <input type="file" id="dpFileInput" accept="image/*" style="display:none;" />
              <button class="btn small full" id="chooseDpBtn">Change profile photo</button>
            </div>

            <div class="setting-card">
              <label>About</label>
              <input type="text" id="aboutInput" placeholder="About" maxlength="140" />
              <button class="btn small full" id="saveAboutBtn">Save about</button>
            </div>

            <div class="setting-card">
              <label>Font size</label>
              <select id="fontSizeSelect">
                <option value="13px">Small</option>
                <option value="14.5px" selected>Medium</option>
                <option value="17px">Large</option>
              </select>
            </div>

            <div class="setting-card">
              <label>Last seen and online</label>
              <select id="privacyLastSeenSelect">
                <option value="everyone">Everyone</option>
                <option value="contacts">My contacts</option>
                <option value="nobody">Nobody</option>
              </select>
            </div>

            <div class="setting-card">
              <label>Profile photo privacy</label>
              <select id="privacyDpSelect">
                <option value="everyone">Everyone</option>
                <option value="contacts">My contacts</option>
                <option value="nobody">Nobody</option>
              </select>
            </div>

            <div class="setting-card">
              <label>Status privacy</label>
              <select id="privacyStatusSelect">
                <option value="everyone">Everyone</option>
                <option value="contacts">My contacts</option>
                <option value="selected">Only share with...</option>
                <option value="nobody">Nobody</option>
              </select>
              <div class="custom-pick-list" id="statusSelectedUsersBox"></div>
            </div>

            <div class="setting-card">
              <label>Chat wallpaper & sound</label>
              <input type="file" id="wallpaperFileInput" accept="image/*" style="display:none;" />
              <button class="btn secondary small full" id="chooseWallpaperBtn">Set chat wallpaper</button>
              <button class="btn secondary small full" id="clearWallpaperBtn">Remove wallpaper</button>
              <select id="soundSelect">
                <option value="chime">Tone: Chime</option>
                <option value="pop">Tone: Pop</option>
                <option value="mute">Tone: Mute</option>
              </select>
              <button class="btn secondary small full" id="testSoundBtn">Test tone</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Chat Panel -->
      <main class="chat-panel" id="chatPanel">
        <div class="chat-overlay">
          <div class="messages" id="messagesContainer">
            <div class="empty-chat">Select a chat to start messaging</div>
          </div>

          <div class="blocked-banner" id="blockedBanner">
            <div id="blockedBannerText">Contact blocked</div>
            <div>
              <button class="btn secondary small" id="unblockFromBannerBtn">Unblock</button>
            </div>
          </div>

          <form class="composer" id="messageForm">
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;" />
            <button type="button" class="icon-btn" id="attachBtn" title="Attach">📎</button>
            <input type="text" id="messageInput" placeholder="Message" autocomplete="off" />
            <button type="button" class="icon-btn" id="voiceBtn" title="Voice message">🎤</button>
            <button type="submit" class="btn small">Send</button>
          </form>
        </div>
      </main>
    </div>
  </section>

  <!-- Contact Info Modal -->
  <div class="modal" id="contactInfoModal">
    <div class="sheet">
      <div style="display:flex; align-items:center; gap:12px;">
        <img id="infoAvatar" class="avatar" style="width:52px; height:52px;" src="" alt="" />
        <div>
          <h3 id="infoName"></h3>
          <p id="infoStatus"></p>
        </div>
      </div>
      <div class="info-row">
        <span style="color:var(--muted);">About</span>
        <span id="infoAbout"></span>
      </div>
      <div class="info-row">
        <span>Chat lock</span>

    function unlockAudio() {

    }

      tab.addEventListener("click", () => switchToTab(tab.dataset.tab));
    });

    function getChatId(uid1, uid2) {
      return [uid1, uid2].sort().join("_");
    }

    function formatClock(ts) {
      if (!ts) return "";
      return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function formatLastSeen(ts) {
      if (!ts) return "Last seen recently";
      const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (diffSec < 60) return "Last seen just now";
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `Last seen ${diffMin} min ago`;
      const d = new Date(ts);
      const t = formatClock(ts);
      const isToday = d.toDateString() === new Date().toDateString();
      return isToday ? `Last seen today at ${t}` : `Last seen ${d.toLocaleDateString()} ${t}`;
    }

    function getSeenStatusIds() {
      if (!currentUser) return {};
      try {
        return JSON.parse(localStorage.getItem(`seenStatuses_${currentUser.uid}`) || "{}");
      } catch (_) {
        return {};
      }
    }

    function markStatusSeen(statusId) {
      if (!currentUser || !statusId) return;
      const map = getSeenStatusIds();
      map[statusId] = true;
      localStorage.setItem(`seenStatuses_${currentUser.uid}`, JSON.stringify(map));
    }

    function getUserStatusRingClass(ownerUid) {
      if (!currentUser || ownerUid === currentUser.uid) return "";
      const seenMap = getSeenStatusIds();
      const userStatuses = Object.entries(allStatuses)
        .filter(([, st]) => st && st.ownerUid === ownerUid && canSeeStatus(allUsers[ownerUid] || { uid: ownerUid }));
      if (!userStatuses.length) return "";
      const hasUnseen = userStatuses.some(([id]) => !seenMap[id]);
      return hasUnseen ? "status-unseen" : "status-seen";
    }

    function isUserBlockedByMe(peerUid) {
      const me = allUsers[currentUser?.uid] || {};
      return !!(me.blocked && me.blocked[peerUid]);
    }

    function isMeBlockedByPeer(peerUid) {
      const peer = allUsers[peerUid] || {};
      return !!(peer.blocked && peer.blocked[currentUser?.uid]);
    }

    function getChatLockPin(peerUid) {
      if (!currentUser || !peerUid) return null;
      return localStorage.getItem(`lock_${currentUser.uid}_${peerUid}`);
    }

    function setChatLockPin(peerUid, pin) {
      if (!currentUser || !peerUid) return;
      if (pin) localStorage.setItem(`lock_${currentUser.uid}_${peerUid}`, pin);
      else localStorage.removeItem(`lock_${currentUser.uid}_${peerUid}`);
    }

    function canSeeDp(targetUser) {
      if (!targetUser || !currentUser) return true;
      if (targetUser.uid === currentUser.uid) return true;
      if (isUserBlockedByMe(targetUser.uid) || isMeBlockedByPeer(targetUser.uid)) return false;
      const mode = (targetUser.privacy && targetUser.privacy.dp) || "everyone";
      if (mode === "nobody") return false;
      if (mode === "contacts") return !!(targetUser.contacts && targetUser.contacts[currentUser.uid]);
      return true;
    }

    function canSeePresence(targetUser) {
      if (!targetUser || !currentUser) return true;
      if (targetUser.uid === currentUser.uid) return true;
      if (isUserBlockedByMe(targetUser.uid) || isMeBlockedByPeer(targetUser.uid)) return false;
      const mode = (targetUser.privacy && targetUser.privacy.lastSeen) || "everyone";
      if (mode === "nobody") return false;
      if (mode === "contacts") return !!(targetUser.contacts && targetUser.contacts[currentUser.uid]);
      return true;
    }

    function canSeeStatus(ownerUser) {
      if (!ownerUser || !currentUser) return false;
      if (ownerUser.uid === currentUser.uid) return true;
      if (isUserBlockedByMe(ownerUser.uid) || isMeBlockedByPeer(ownerUser.uid)) return false;
      const priv = ownerUser.privacy || {};
      const mode = priv.status || "everyone";
      if (mode === "nobody") return false;
      if (mode === "contacts") return !!(ownerUser.contacts && ownerUser.contacts[currentUser.uid]);
      if (mode === "selected") return !!(priv.statusSelected && priv.statusSelected[currentUser.uid]);
      return true;
    }

    function isActuallyOnline(u) {
      if (!u || u.online !== true) return false;
      if (u.lastPing && (Date.now() - u.lastPing) > 45000) return false;
      return true;
    }

    function getPresenceDisplay(userObj) {
      if (!canSeePresence(userObj)) {
        return { html: "", isOnline: false, plain: "" };
      }
      if (isActuallyOnline(userObj)) {
        return {
          html: `<span class="mini-disc"></span><span>Online</span>`,
          isOnline: true,
          plain: "Online"
        };
      }
      const ls = formatLastSeen(userObj && (userObj.lastSeen || userObj.lastPing));
      return { html: `<span>${escapeHtml(ls)}</span>`, isOnline: false, plain: ls };
    }

    function updateTopHeader() {

    function updateBlockedComposerState() {
      if (!selectedPeer || !currentUser) return;
      const blockedMe = isUserBlockedByMe(selectedPeer.uid);
      const blockedByPeer = isMeBlockedByPeer(selectedPeer.uid);

      if (blockedMe) {

      }
    }

    function setupPresence(uid) {
      const userRef = db.ref(`users/${uid}`);
      const connectedRef = db.ref(".info/connected");

      const markOfflineNow = () => {
        const now = Date.now();
        userRef.update({ online: false, lastSeen: now, lastPing: now }).catch(() => {});
      };

      const markOnlineNow = () => {
        if (!navigator.onLine || document.hidden) return;
        userRef.update({ online: true, lastPing: Date.now() }).catch(() => {});
      };

      connectedRef.on("value", (snap) => {
        if (snap.val() === true && navigator.onLine) {
          markOnlineNow();
          userRef.onDisconnect().update({
            online: false,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
        } else {
          markOfflineNow();
        }
      });

      window.addEventListener("offline", markOfflineNow);
      window.addEventListener("online", markOnlineNow);
      document.addEventListener("visibilitychange", () => {
        if (!currentUser) return;
        if (document.hidden || !navigator.onLine) markOfflineNow();
        else markOnlineNow();
      });

      setInterval(() => {
        if (!currentUser) return;
        if (!navigator.onLine || document.hidden) markOfflineNow();
        else markOnlineNow();
        renderUsersList();
        updateTopHeader();
      }, 15000);
    }

    function playNotificationSound() {
      const mode = soundSelect.value || localStorage.getItem("chatSound") || "chime";
      if (mode === "mute") return;
      try {
        unlockAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = mode === "chime" ? "sine" : "triangle";
        osc.frequency.setValueAtTime(mode === "chime" ? 660 : 440, audioCtx.currentTime);
        if (mode === "chime") {
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.18);
        }
        gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
      } catch (_) {}
    }

    function renderTickSvg(msg) {
      if (msg.senderId !== currentUser.uid) return "";
      const isSeen = msg.status === "seen";
      const isDouble = isSeen || msg.status === "delivered" || (navigator.onLine && msg.sentOnline === true);
      const seenClass = isSeen ? " seen" : "";

      if (isDouble) {
        return `
          <svg class="tick-svg${seenClass}" viewBox="0 0 24 16">
            <path d="M2 8.5L6.5 13L15.5 3" />
            <path d="M8.5 8.5L13 13L22 3" />
          </svg>
        `;
      }
      return `
        <svg class="tick-svg" viewBox="0 0 20 16">
          <path d="M4 8.5L8.5 13L17.5 3" />
        </svg>
      `;
    }

    authSubmitBtn.addEventListener("click", async () => {
      unlockAudio();
      authError.textContent = "";
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const displayName = nameInput.value.trim();
      if (!email || !password) {
        authError.textContent = "Enter email and password.";
        return;
      }
      try {
        if (isRegisterMode) {
          if (!displayName) {
            authError.textContent = "Enter your name.";
            return;
          }
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.ref(`users/${cred.user.uid}`).set({
            uid: cred.user.uid,
            name: displayName,
            email,
            about: "Hey there! I am using WhatsApp",
            dp: DEFAULT_DP,
            online: true,
            lastSeen: Date.now(),
            lastPing: Date.now(),
            privacy: { lastSeen: "everyone", dp: "everyone", status: "everyone", statusSelected: {} }
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        authError.textContent = err.message;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      if (currentUser) {
        await db.ref(`users/${currentUser.uid}`).update({ online: false, lastSeen: Date.now() }).catch(() => {});

      if (messagesRef) messagesRef.off();
      auth.signOut();

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        authScreen.classList.remove("active");

        soundSelect.value = localStorage.getItem("chatSound") || "chime";

        document.documentElement.style.setProperty("--msg-font-size", savedFont);

        setupPresence(user.uid);

        db.ref("users").on("value", (snap) => {
          allUsers = snap.val() || {};
          syncSettingsFromUser();
          renderUsersList();
          renderStatusFeed();
          updateTopHeader();
        });

        db.ref("statuses").on("value", (snap) => {
          allStatuses = snap.val() || {};
          renderUsersList();
          renderStatusFeed();
          updateTopHeader();
        });
      } else {
        currentUser = null;
        selectedPeer = null;
        chatScreen.classList.remove("active");
        authScreen.classList.add("active");
      }
    });

    function syncSettingsFromUser() {

    function attachLongPress(el, handler) {
      let timer = null;
      const start = () => {
        timer = setTimeout(() => { timer = null; handler(); }, 450);
      };
      const cancel = () => {
        if (timer) { clearTimeout(timer); timer = null; }
      };
      el.addEventListener("touchstart", start, { passive: true });
      el.addEventListener("touchend", cancel);
      el.addEventListener("touchmove", cancel);
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", cancel);
      el.addEventListener("mouseleave", cancel);
      el.addEventListener("contextmenu", (e) => { e.preventDefault(); handler(); });
    }

    function renderOrUpdateMessage(msgId, msg) {
      if (!currentUser) return;
      const existing = messagesContainer.querySelector(`[data-msg-id="${msgId}"]`);

      if (msg.deletedFor && msg.deletedFor[currentUser.uid]) {
        if (existing) existing.remove();
        return;
      }

      const emptyEl = messagesContainer.querySelector(".empty-chat");
      if (emptyEl) emptyEl.remove();

      const isMine = msg.senderId === currentUser.uid;
      const isDeletedEveryone = !!msg.deletedForEveryone;

      let bodyHtml = "";
      if (isDeletedEveryone) {
        bodyHtml = `<div>This message was deleted</div>`;
      } else {
        let mediaHtml = "";
        if (msg.mediaType === "image" && msg.mediaUrl) {
          mediaHtml = `<img src="${escapeAttr(msg.mediaUrl)}" alt="" />`;
        } else if (msg.mediaType === "video" && msg.mediaUrl) {
          mediaHtml = `<video controls src="${escapeAttr(msg.mediaUrl)}"></video>`;
        } else if (msg.mediaType === "audio" && msg.mediaUrl) {
          mediaHtml = `<audio controls src="${escapeAttr(msg.mediaUrl)}"></audio>`;
        }
        const editedHtml = msg.edited ? `<span class="edited-tag">Edited</span>` : "";
        const textHtml = msg.text ? `<div>${escapeHtml(msg.text)}${editedHtml}</div>` : "";
        bodyHtml = `${textHtml}${mediaHtml}`;
      }

      const timeStr = formatClock(msg.timestamp);
      const tickHtml = isDeletedEveryone ? "" : renderTickSvg(msg);
      const html = `${bodyHtml}<div class="msg-meta"><time>${timeStr}</time>${tickHtml}</div>`;

      let div = existing;
      if (!div) {
        div = document.createElement("div");
        div.setAttribute("data-msg-id", msgId);
        messagesContainer.appendChild(div);
      }

      div.className = "msg " + (isMine ? "sent" : "recv") + (isDeletedEveryone ? " deleted-msg" : "");
      div.innerHTML = html;

      if (!isDeletedEveryone) {
        attachLongPress(div, () => openMessageActionSheet(msgId, msg));
      }

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

        if (MEDIA_UPLOAD_URL && MEDIA_UPLOAD_PRESET) {
          const fd = new FormData();
          fd.append("file", file);
          fd.append("upload_preset", MEDIA_UPLOAD_PRESET);
          const res = await fetch(MEDIA_UPLOAD_URL, { method: "POST", body: fd });
          const data = await res.json();
          if (!data.secure_url) throw new Error("Upload failed");
          finalUrl = data.secure_url;
        } else if (!isVideo && file.size <= 350 * 1024) {
          finalUrl = await new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = reject;
            r.readAsDataURL(file);
          });

          throw new Error("Large files/videos require upload config.");

        await db.ref(`chats/${chatId}/messages`).push({
          senderId: currentUser.uid,
          receiverId: selectedPeer.uid,
          text: "",
          mediaType,
          mediaUrl: finalUrl,
          sentOnline: !!navigator.onLine,
          status: initialStatus,
          timestamp: firebase.database.ServerValue.TIMESTAMP

    // Voice message (tap to record / tap again to send)
    voiceBtn.addEventListener("click", async () => {
      if (!selectedPeer || !currentUser) return;
      if (isUserBlockedByMe(selectedPeer.uid) || isMeBlockedByPeer(selectedPeer.uid)) return;

      if (!isRecordingVoice) {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("Microphone not supported on this browser.");
            return;
          }
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          isRecordingVoice = true;
          voiceBtn.classList.add("recording");
          voiceBtn.textContent = "⏹";

          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) audioChunks.push(ev.data);
          };

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach((t) => t.stop());
            voiceBtn.classList.remove("recording");
            voiceBtn.textContent = "🎤";
            isRecordingVoice = false;

            const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
            if (blob.size < 300) return;

            const reader = new FileReader();
            reader.onloadend = async () => {
              const peerLive = allUsers[selectedPeer.uid] || selectedPeer;
              const chatId = getChatId(currentUser.uid, selectedPeer.uid);
              await db.ref(`chats/${chatId}/messages`).push({
                senderId: currentUser.uid,
                receiverId: selectedPeer.uid,
                text: "",
                mediaType: "audio",
                mediaUrl: reader.result,
                sentOnline: !!navigator.onLine,
                status: isActuallyOnline(peerLive) ? "delivered" : "sent",
                timestamp: firebase.database.ServerValue.TIMESTAMP
              });
            };
            reader.readAsDataURL(blob);
          };

          mediaRecorder.start();
        } catch (err) {
          isRecordingVoice = false;
          voiceBtn.classList.remove("recording");
          voiceBtn.textContent = "🎤";
          alert("Mic permission error: " + err.message);
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
      }
    });

    function renderStatusFeed() {
      if (!currentUser) return;
      statusFeedList.innerHTML = "";
      const seenMap = getSeenStatusIds();

      const entries = Object.entries(allStatuses)
        .map(([id, st]) => ({ id, ...st }))
        .filter((st) => canSeeStatus(allUsers[st.ownerUid] || { uid: st.ownerUid }))
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      if (!entries.length) {
        statusFeedList.innerHTML = `<div class="empty-chat">No status updates</div>`;
        return;
      }

      entries.forEach((st) => {
        const isMine = st.ownerUid === currentUser.uid;
        const owner = allUsers[st.ownerUid] || {};
        const isUnseen = !isMine && !seenMap[st.id];
        const ringClass = isMine ? "" : (isUnseen ? "status-unseen" : "status-seen");
        const bg = st.bgColor || "#1b5e20";

        const card = document.createElement("div");
        card.className = "status-card";
        card.innerHTML = `
          <div style="display:flex; align-items:center; gap:9px;">
            <div class="avatar-wrap ${ringClass}">
              <img class="avatar" src="${canSeeDp(owner) ? (owner.dp || DEFAULT_DP) : DEFAULT_DP}" alt="" />
            </div>
            <div style="font-weight:600; font-size:13.5px;">${escapeHtml(st.ownerName || "")}</div>
          </div>
          ${st.text ? `<div class="status-text-banner" style="background:${escapeAttr(bg)};">${escapeHtml(st.text)}</div>` : ""}
          ${st.photoUrl ? `<img class="status-media" src="${escapeAttr(st.photoUrl)}" alt="" />` : ""}
          <div class="status-foot">
            <span>${formatClock(st.createdAt)}</span>
            ${isMine ? `<button class="btn danger small" data-del="${escapeAttr(st.id)}">Delete</button>` : ""}
          </div>
        `;

        card.addEventListener("click", (ev) => {
          if (ev.target.closest("[data-del]")) return;
          if (!isMine) {
            markStatusSeen(st.id);
            renderStatusFeed();
            renderUsersList();
            updateTopHeader();
          }
        });

        const del = card.querySelector("[data-del]");
        if (del) {
          del.addEventListener("click", async (ev) => {
            ev.stopPropagation();
            await db.ref(`statuses/${st.id}`).remove();
          });
        }
        statusFeedList.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
